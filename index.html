<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luna AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b111a;
      color: #f4f7fb;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 260px;
      background: #101925;
      border-right: 1px solid #243142;
      padding: 18px;
      display: flex;
      flex-direction: column;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: #182538;
      border: 1px solid #304158;
      font-size: 24px;
    }

    .brand-name {
      font-size: 19px;
      font-weight: 700;
    }

    .brand-subtitle {
      color: #8997aa;
      font-size: 12px;
      margin-top: 3px;
    }

    .new-chat {
      border: 1px solid #304158;
      background: #172335;
      color: white;
      border-radius: 11px;
      padding: 12px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .new-chat:hover {
      background: #1d2c42;
    }

    .section-title {
      color: #77869a;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .suggestion {
      width: 100%;
      border: 0;
      background: transparent;
      color: #dce4ef;
      text-align: left;
      padding: 10px;
      border-radius: 9px;
      cursor: pointer;
      margin-bottom: 3px;
    }

    .suggestion:hover {
      background: #172335;
    }

    .sidebar-bottom {
      margin-top: auto;
      color: #8290a3;
      font-size: 12px;
    }

    .online {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #65d391;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 64px;
      border-bottom: 1px solid #202d3d;
      display: flex;
      align-items: center;
      padding: 0 22px;
    }

    .model {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 600;
    }

    .moon {
      font-size: 22px;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 35px 20px 150px;
    }

    .welcome {
      max-width: 850px;
      margin: 70px auto 30px;
      text-align: center;
    }

    .welcome-logo {
      font-size: 52px;
      margin-bottom: 12px;
    }

    .welcome h1 {
      margin: 0;
      font-size: 36px;
    }

    .welcome p {
      color: #8d9bad;
      max-width: 600px;
      margin: 12px auto 30px;
      line-height: 1.6;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .card {
      background: #111d2b;
      border: 1px solid #27364a;
      color: white;
      border-radius: 13px;
      padding: 18px;
      text-align: left;
      cursor: pointer;
    }

    .card:hover {
      background: #172538;
    }

    .card strong {
      display: block;
      margin-bottom: 6px;
    }

    .card small {
      color: #8290a3;
    }

    .messages {
      max-width: 850px;
      margin: auto;
    }

    .message {
      display: flex;
      gap: 13px;
      margin: 22px 0;
      line-height: 1.6;
    }

    .avatar {
      min-width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: #182538;
    }

    .user .avatar {
      background: #26364b;
    }

    .content {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .composer-area {
      position: fixed;
      bottom: 0;
      left: 260px;
      right: 0;
      padding: 18px 20px 20px;
      background: linear-gradient(transparent, #0b111a 25%);
    }

    .composer {
      max-width: 850px;
      margin: auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: #111c29;
      border: 1px solid #2b3a4d;
      border-radius: 16px;
      padding: 9px;
    }

    textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font: inherit;
      min-height: 42px;
      max-height: 160px;
      padding: 11px 7px;
    }

    textarea::placeholder {
      color: #718096;
    }

    button {
      font-family: inherit;
    }

    .attach,
    .send {
      border: 0;
      cursor: pointer;
      border-radius: 11px;
      width: 42px;
      height: 42px;
      color: white;
    }

    .attach {
      background: transparent;
      font-size: 22px;
    }

    .send {
      background: #24364d;
      font-size: 20px;
    }

    .send:hover {
      background: #304762;
    }

    .preview {
      max-width: 850px;
      margin: 0 auto 8px;
    }

    .preview img {
      max-height: 100px;
      max-width: 160px;
      border-radius: 10px;
      border: 1px solid #33465d;
    }

    .hidden {
      display: none;
    }

    .note {
      text-align: center;
      color: #66758a;
      font-size: 11px;
      margin-top: 8px;
    }

    @media (max-width: 700px) {
      .sidebar {
        display: none;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .welcome {
        margin-top: 30px;
      }

      .welcome h1 {
        font-size: 29px;
      }

      .composer-area {
        left: 0;
      }

      .chat {
        padding-left: 14px;
        padding-right: 14px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="brand">
      <div class="logo">☾</div>
      <div>
        <div class="brand-name">Luna AI</div>
        <div class="brand-subtitle">Your AI assistant</div>
      </div>
    </div>

    <button class="new-chat" onclick="newChat()">＋ New chat</button>

    <div class="section-title">QUICK START</div>

    <button class="suggestion" onclick="quickMessage('Explain something complicated in a simple way.')">
      ✦ Explain something
    </button>

    <button class="suggestion" onclick="quickMessage('Help me brainstorm an idea.')">
      ✧ Brainstorm an idea
    </button>

    <button class="suggestion" onclick="quickMessage('Help me write something.')">
      ✎ Help me write
    </button>

    <div class="sidebar-bottom">
      <div class="online">
        <span class="dot"></span>
        Luna is online
      </div>
      <div>Powered by Ollama Cloud</div>
    </div>

  </aside>

  <main class="main">

    <header class="topbar">
      <div class="model">
        <span class="moon">☾</span>
        Luna AI
      </div>
    </header>

    <section class="chat" id="chat">

      <div class="welcome" id="welcome">

        <div class="welcome-logo">☾</div>

        <h1>How can I help?</h1>

        <p>
          Ask Luna anything, brainstorm ideas, get explanations,
          or upload an image for Luna to look at.
        </p>

        <div class="cards">

          <button class="card" onclick="quickMessage('What are some interesting things I could learn today?')">
            <strong>✦ Learn something</strong>
            <small>Explore a new topic</small>
          </button>

          <button class="card" onclick="quickMessage('Help me come up with a creative idea.')">
            <strong>✧ Get creative</strong>
            <small>Brainstorm with Luna</small>
          </button>

          <button class="card" onclick="quickMessage('Give me a useful tip I can use today.')">
            <strong>⌁ Get a tip</strong>
            <small>Something practical</small>
          </button>

        </div>

      </div>

      <div class="messages" id="messages"></div>

    </section>

    <div class="composer-area">

      <div id="preview" class="preview hidden"></div>

      <form class="composer" id="form">

        <input
          type="file"
          id="imageInput"
          accept="image/png,image/jpeg,image/webp,image/gif"
          hidden
        >

        <button
          type="button"
          class="attach"
          onclick="document.getElementById('imageInput').click()"
          title="Upload image"
        >
          ＋
        </button>

        <textarea
          id="input"
          rows="1"
          placeholder="Message Luna..."
        ></textarea>

        <button class="send" type="submit">↑</button>

      </form>

      <div class="note">
        Luna can make mistakes. Check important information.
      </div>

    </div>

  </main>

</div>

<script>

let selectedImage = null;

const form = document.getElementById("form");
const input = document.getElementById("input");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");
const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");

let conversation = [];

imageInput.addEventListener("change", () => {

  const file = imageInput.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = () => {

    selectedImage = reader.result;

    preview.innerHTML = `<img src="${selectedImage}" alt="Selected image">`;
    preview.classList.remove("hidden");

  };

  reader.readAsDataURL(file);

});

function addMessage(role, text, image = null) {

  welcome.style.display = "none";

  const message = document.createElement("div");

  message.className = `message ${role}`;

  message.innerHTML = `
    <div class="avatar">${role === "user" ? "●" : "☾"}</div>
    <div class="content"></div>
  `;

  const content = message.querySelector(".content");

  if (image) {
    content.innerHTML += `<img src="${image}" style="max-width:300px;border-radius:12px;margin-bottom:10px;display:block;">`;
  }

  content.innerHTML += escapeHtml(text);

  messages.appendChild(message);

  document.getElementById("chat").scrollTop =
    document.getElementById("chat").scrollHeight;
}

function escapeHtml(text) {

  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;

}

async function sendMessage(text) {

  if (!text.trim() && !selectedImage) return;

  const imageForMessage = selectedImage;

  addMessage("user", text || "What do you see in this image?", imageForMessage);

  conversation.push({
    role: "user",
    content: text || "What do you see in this image?",
    ...(imageForMessage
      ? { images: [imageForMessage.replace(/^data:image\/[^;]+;base64,/, "")] }
      : {})
  });

  input.value = "";
  selectedImage = null;
  imageInput.value = "";
  preview.classList.add("hidden");
  preview.innerHTML = "";

  const thinking = document.createElement("div");

  thinking.className = "message assistant";
  thinking.innerHTML = `
    <div class="avatar">☾</div>
    <div class="content">Thinking...</div>
  `;

  messages.appendChild(thinking);

  document.getElementById("chat").scrollTop =
    document.getElementById("chat").scrollHeight;

  try {

    const response = await fetch("/api/chat", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        messages: conversation
      })

    });

    const data = await response.json();

    thinking.remove();

    if (!response.ok) {
      throw new Error(data.error || "Something went wrong.");
    }

    const answer =
      data.message?.content ||
      data.response ||
      "Luna didn't return a response.";

    conversation.push({
      role: "assistant",
      content: answer
    });

    addMessage("assistant", answer);

  } catch (error) {

    thinking.querySelector(".content").textContent =
      "Sorry, I couldn't connect to Luna right now.";

    console.error(error);

  }

}

form.addEventListener("submit", event => {

  event.preventDefault();

  sendMessage(input.value);

});

input.addEventListener("keydown", event => {

  if (event.key === "Enter" && !event.shiftKey) {

    event.preventDefault();

    form.requestSubmit();

  }

});

function quickMessage(text) {
  sendMessage(text);
}

function newChat() {

  conversation = [];
  messages.innerHTML = "";
  welcome.style.display = "block";

}

</script>

</body>
</html>
