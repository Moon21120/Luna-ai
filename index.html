<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Luna AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #0b111a;
      color: #f4f7fb;
    }

    body {
      overflow: hidden;
    }

    button,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100dvh;
      min-height: 100dvh;
    }

    /* SIDEBAR */

    .sidebar {
      width: 270px;
      flex-shrink: 0;
      background: #101925;
      border-right: 1px solid #243142;
      padding: 18px;
      display: flex;
      flex-direction: column;
      z-index: 1001;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: #182538;
      border: 1px solid #304158;
      overflow: hidden;
      flex-shrink: 0;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-name {
      font-size: 19px;
      font-weight: 700;
    }

    .brand-subtitle {
      color: #8997aa;
      font-size: 12px;
      margin-top: 3px;
    }

    .new-chat {
      width: 100%;
      border: 1px solid #304158;
      background: #172335;
      color: white;
      border-radius: 11px;
      padding: 12px;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .new-chat:hover {
      background: #1d2c42;
    }

    .section-title {
      color: #77869a;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 9px;
    }

    .quick-button {
      width: 100%;
      border: 0;
      background: transparent;
      color: #dce4ef;
      text-align: left;
      padding: 10px;
      border-radius: 9px;
      margin-bottom: 3px;
    }

    .quick-button:hover {
      background: #172335;
    }

    .saved-title {
      margin-top: 22px;
    }

    .saved-chats {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    /* CHAT ROW */

    .chat-row {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      margin-bottom: 2px;
      border-radius: 8px;
    }

    .chat-row:hover,
    .chat-row.active {
      background: #182538;
    }

    .saved-chat {
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      color: #cbd5e1;
      text-align: left;
      padding: 10px;
      padding-right: 40px;
      border-radius: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-row:hover .saved-chat,
    .chat-row.active .saved-chat {
      color: white;
    }

    .chat-options {
      position: absolute;
      right: 5px;
      top: 5px;
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #9aa8ba;
      font-size: 18px;
      line-height: 1;
    }

    .chat-options:hover {
      background: #26364b;
      color: white;
    }

    /* CHAT MENU */

    .chat-menu {
      position: absolute;
      z-index: 2000;
      right: 8px;
      top: 38px;
      width: 150px;
      background: #172335;
      border: 1px solid #304158;
      border-radius: 10px;
      padding: 5px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .45);
    }

    .chat-menu button {
      width: 100%;
      border: 0;
      background: transparent;
      color: #e1e7ef;
      text-align: left;
      padding: 10px;
      border-radius: 7px;
      font-size: 13px;
    }

    .chat-menu button:hover {
      background: #26364b;
    }

    .chat-menu .delete-option {
      color: #ff8585;
    }

    .empty-history {
      color: #66758a;
      font-size: 12px;
      padding: 8px;
    }

    .sidebar-bottom {
      padding-top: 15px;
      color: #8290a3;
      font-size: 12px;
      border-top: 1px solid #202d3d;
    }

    .online {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #65d391;
    }

    /* MOBILE MENU */

    .mobile-menu {
      display: none;
      border: 0;
      background: transparent;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      font-size: 23px;
      place-items: center;
      flex-shrink: 0;
    }

    .mobile-menu:hover {
      background: #182538;
    }

    .sidebar-overlay {
      display: none;
    }

    /* MAIN */

    .main {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #0b111a;
    }

    /* TOP BAR */

    .topbar {
      height: 64px;
      min-height: 64px;
      flex-shrink: 0;
      border-bottom: 1px solid #202d3d;
      display: flex;
      align-items: center;
      padding: 0 25px;
      gap: 10px;
    }

    .model {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 600;
    }

    .model-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      object-fit: cover;
      display: block;
    }

    /* VOICE CALL BUTTON */

    .voice-call {
      margin-left: auto;
      border: 1px solid #304158;
      background: #172335;
      color: white;
      border-radius: 10px;
      padding: 9px 13px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 7px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .voice-call:hover {
      background: #24364d;
    }

    .voice-call.active {
      background: #26364b;
      border-color: #526987;
    }

    /* CHAT */

    .chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 35px 25px 170px;
      -webkit-overflow-scrolling: touch;
    }

    .chat-inner {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    /* WELCOME */

    .welcome {
      text-align: center;
      margin: 70px auto 35px;
    }

    .welcome-logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 14px;
      border-radius: 24px;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .welcome-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .welcome h1 {
      margin: 0;
      font-size: 36px;
    }

    .welcome p {
      color: #8d9bad;
      max-width: 600px;
      margin: 12px auto 30px;
      line-height: 1.6;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .card {
      background: #111d2b;
      border: 1px solid #27364a;
      color: white;
      border-radius: 13px;
      padding: 18px;
      text-align: left;
    }

    .card:hover {
      background: #172538;
    }

    .card strong {
      display: block;
      margin-bottom: 6px;
    }

    .card small {
      color: #8290a3;
    }

    /* MESSAGES */

    .messages {
      display: flex;
      flex-direction: column;
      gap: 28px;
      width: 100%;
    }

    .message {
      display: flex;
      width: 100%;
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.assistant {
      justify-content: flex-end;
    }

    .message-box {
      max-width: 75%;
      display: flex;
      gap: 11px;
      align-items: flex-start;
    }

    .assistant .message-box {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 34px;
      min-width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: #182538;
      color: white;
      overflow: hidden;
    }

    .avatar.luna-avatar {
      padding: 0;
    }

    .avatar.luna-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .user .avatar {
      background: #26364b;
    }

    .message-content {
      padding: 9px 13px;
      border-radius: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .user .message-content {
      background: #1b2a3d;
      border-top-left-radius: 4px;
    }

    .assistant .message-content {
      background: #111a27;
      border: 1px solid #263547;
      border-top-right-radius: 4px;
    }

    /* MARKDOWN */

    .message-content strong {
      font-weight: 700;
      color: #ffffff;
    }

    .message-content em {
      font-style: italic;
    }

    .message-content del {
      opacity: 0.75;
    }

    .message-content code {
      background: #1c2939;
      border: 1px solid #2c3c50;
      border-radius: 5px;
      padding: 2px 5px;
      font-family: Consolas, Monaco, monospace;
      font-size: 0.9em;
    }

    .message-content pre {
      display: block;
      white-space: pre-wrap;
      overflow-x: auto;
      background: #0a111b;
      border: 1px solid #263547;
      border-radius: 9px;
      padding: 12px;
      margin: 10px 0;
      font-family: Consolas, Monaco, monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    .message-content pre code {
      background: transparent;
      border: 0;
      padding: 0;
      border-radius: 0;
    }

    .message-content ul,
    .message-content ol {
      margin: 8px 0;
      padding-left: 24px;
    }

    .message-content li {
      margin: 3px 0;
    }

    .message-content a {
      color: #8db9ff;
      text-decoration: underline;
    }

    .thinking {
      color: #7f8da0;
      font-style: italic;
    }

    /* COMPOSER */

    .composer-area {
      position: fixed;
      z-index: 10;
      bottom: 0;
      left: 270px;
      right: 0;
      padding: 18px 25px 20px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      background: linear-gradient(
        transparent,
        #0b111a 25%
      );
    }

    .composer {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: #111c29;
      border: 1px solid #2b3a4d;
      border-radius: 16px;
      padding: 9px;
    }

    textarea {
      flex: 1;
      width: 100%;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 15px;
      line-height: 1.5;
      min-height: 42px;
      max-height: 160px;
      padding: 11px 7px;
    }

    textarea::placeholder {
      color: #718096;
    }

    .send {
      border: 0;
      cursor: pointer;
      flex-shrink: 0;
      border-radius: 11px;
      width: 42px;
      height: 42px;
      color: white;
      background: #24364d;
      font-size: 20px;
    }

    .send:hover {
      background: #304762;
    }

    .send:disabled {
      opacity: .5;
      cursor: default;
    }

    .note {
      text-align: center;
      color: #66758a;
      font-size: 11px;
      margin-top: 8px;
    }

    /* VOICE STATUS */

    .voice-status {
      display: none;
      text-align: center;
      color: #9aa8ba;
      font-size: 12px;
      margin-top: 7px;
    }

    .voice-status.visible {
      display: block;
    }

    /* TABLET */

    @media (max-width: 900px) {

      .sidebar {
        width: 230px;
        padding: 14px;
      }

      .composer-area {
        left: 230px;
      }

      .chat {
        padding-left: 18px;
        padding-right: 18px;
      }

      .topbar {
        padding-left: 18px;
        padding-right: 18px;
      }

      .message-box {
        max-width: 82%;
      }
    }

    /* MOBILE */

    @media (max-width: 700px) {

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .app {
        width: 100%;
        height: 100dvh;
        min-height: 100dvh;
      }

      .sidebar {
        position: fixed;
        z-index: 1001;
        left: 0;
        top: 0;
        bottom: 0;
        width: min(300px, 85vw);
        display: flex;
        transform: translateX(-105%);
        transition: transform 0.25s ease;
        box-shadow: 12px 0 35px rgba(0, 0, 0, .45);
        overflow-y: auto;
      }

      .sidebar.mobile-open {
        transform: translateX(0);
      }

      .sidebar-overlay {
        position: fixed;
        z-index: 1000;
        inset: 0;
        display: block;
        background: rgba(0, 0, 0, .55);
        opacity: 0;
        pointer-events: none;
        transition: opacity .25s ease;
      }

      .sidebar-overlay.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .main {
        width: 100%;
        height: 100%;
        min-width: 0;
      }

      .topbar {
        height: 56px;
        min-height: 56px;
        padding: 0 12px;
      }

      .mobile-menu {
        display: grid;
      }

      .model {
        font-size: 16px;
      }

      .model-logo {
        width: 27px;
        height: 27px;
        border-radius: 8px;
      }

      .voice-call {
        padding: 8px 10px;
        font-size: 12px;
      }

      .chat {
        width: 100%;
        padding: 22px 12px 155px;
      }

      .chat-inner {
        width: 100%;
        max-width: none;
      }

      .welcome {
        margin: 30px auto 25px;
        padding: 0 5px;
      }

      .welcome-logo {
        width: 68px;
        height: 68px;
        border-radius: 20px;
        margin-bottom: 12px;
      }

      .welcome h1 {
        font-size: 28px;
      }

      .welcome p {
        font-size: 14px;
        line-height: 1.5;
        margin: 10px auto 22px;
      }

      .cards {
        grid-template-columns: 1fr;
        gap: 9px;
      }

      .card {
        width: 100%;
        padding: 15px;
        min-height: 70px;
      }

      .messages {
        gap: 20px;
      }

      .message-box {
        max-width: 88%;
        gap: 7px;
      }

      .avatar {
        width: 30px;
        min-width: 30px;
        height: 30px;
        border-radius: 9px;
        font-size: 13px;
      }

      .message-content {
        padding: 9px 11px;
        font-size: 14px;
        line-height: 1.55;
      }

      .composer-area {
        left: 0;
        right: 0;
        width: 100%;
        padding: 10px 10px 10px;
        padding-bottom: calc(
          10px + env(safe-area-inset-bottom)
        );
        background: linear-gradient(
          transparent,
          #0b111a 18%
        );
      }

      .composer {
        width: 100%;
        max-width: none;
        border-radius: 15px;
        padding: 7px;
        gap: 5px;
      }

      textarea {
        font-size: 16px;
        min-height: 42px;
        max-height: 120px;
        padding: 10px 6px;
      }

      .send {
        width: 40px;
        height: 40px;
        min-width: 40px;
      }

      .note {
        font-size: 9px;
        margin-top: 5px;
      }
    }

    @media (max-width: 380px) {

      .sidebar {
        width: 86vw;
      }

      .topbar {
        padding-left: 8px;
        padding-right: 8px;
      }

      .chat {
        padding-left: 9px;
        padding-right: 9px;
      }

      .message-box {
        max-width: 92%;
      }

      .message-content {
        font-size: 13.5px;
      }

      .welcome h1 {
        font-size: 26px;
      }

      .welcome p {
        font-size: 13px;
      }

      .composer-area {
        padding-left: 7px;
        padding-right: 7px;
      }

      .voice-call {
        padding: 7px 8px;
      }

      .voice-call span:last-child {
        display: none;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div
    class="sidebar-overlay"
    id="sidebarOverlay"
  ></div>

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="brand">

      <div class="logo">
        <img
          src="Luna profile.webp"
          alt="Luna AI"
        >
      </div>

      <div>
        <div class="brand-name">
          Luna AI
        </div>

        <div class="brand-subtitle">
          Your AI assistant
        </div>
      </div>

    </div>

    <button
      class="new-chat"
      onclick="newChat()"
    >
      ＋ New chat
    </button>

    <div class="section-title">
      QUICK START
    </div>

    <button
      class="quick-button"
      onclick="quickMessage('Explain something complicated in a simple way.')"
    >
      ✦ Explain something
    </button>

    <button
      class="quick-button"
      onclick="quickMessage('Help me brainstorm an idea.')"
    >
      ✧ Brainstorm an idea
    </button>

    <button
      class="quick-button"
      onclick="quickMessage('Help me write something.')"
    >
      ✎ Help me write
    </button>

    <div class="section-title saved-title">
      CHATS
    </div>

    <div
      class="saved-chats"
      id="savedChats"
    ></div>

    <div class="sidebar-bottom">

      <div class="online">
        <span class="dot"></span>
        Luna is online
      </div>

      <div>
        Powered by Ollama Cloud
      </div>

    </div>

  </aside>

  <main class="main">

    <header class="topbar">

      <button
        class="mobile-menu"
        id="mobileMenu"
        aria-label="Open menu"
        type="button"
      >
        ☰
      </button>

      <div class="model">

        <img
          class="model-logo"
          src="Luna profile.webp"
          alt="Luna"
        >

        <span>
          Luna AI
        </span>

      </div>

      <button
        class="voice-call"
        id="voiceCall"
        type="button"
        aria-label="Start voice call"
      >
        <span>🎙</span>
        <span>Voice Call</span>
      </button>

    </header>

    <section
      class="chat"
      id="chat"
    >

      <div class="chat-inner">

        <div
          class="welcome"
          id="welcome"
        >

          <div class="welcome-logo">
            <img
              src="Luna profile.webp"
              alt="Luna AI"
            >
          </div>

          <h1>
            How can I help?
          </h1>

          <p>
            Talk with Luna, ask questions,
            brainstorm ideas, or just have a
            conversation.
          </p>

          <div class="cards">

            <button
              class="card"
              onclick="quickMessage('What are some interesting things I could learn today?')"
            >
              <strong>
                ✦ Learn something
              </strong>

              <small>
                Explore a new topic
              </small>
            </button>

            <button
              class="card"
              onclick="quickMessage('Help me come up with a creative idea.')"
            >
              <strong>
                ✧ Get creative
              </strong>

              <small>
                Brainstorm with Luna
              </small>
            </button>

            <button
              class="card"
              onclick="quickMessage('Give me a useful tip I can use today.')"
            >
              <strong>
                ⌁ Get a tip
              </strong>

              <small>
                Something practical
              </small>
            </button>

          </div>

        </div>

        <div
          class="messages"
          id="messages"
        ></div>

      </div>

    </section>

    <div class="composer-area">

      <form
        class="composer"
        id="form"
      >

        <textarea
          id="input"
          rows="1"
          maxlength="20000"
          placeholder="Message Luna..."
          autocomplete="off"
        ></textarea>

        <button
          class="send"
          id="send"
          type="submit"
          aria-label="Send message"
        >
          ↑
        </button>

      </form>

      <div
        class="voice-status"
        id="voiceStatus"
      >
        🎙 Listening...
      </div>

      <div class="note">
        Luna can make mistakes. Check important information.
      </div>

    </div>

  </main>

</div>

<script>

/* =========================================================
   STORAGE
   ========================================================= */

const STORAGE_KEY = "luna_chats";
const MEMORY_KEY = "luna_memory";

let chats =
  JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
  );

let memory =
  JSON.parse(
    localStorage.getItem(MEMORY_KEY) || "[]"
  );

let currentChat = null;
let conversation = [];


/* =========================================================
   ELEMENTS
   ========================================================= */

const form =
  document.getElementById("form");

const input =
  document.getElementById("input");

const messages =
  document.getElementById("messages");

const welcome =
  document.getElementById("welcome");

const savedChats =
  document.getElementById("savedChats");

const sendButton =
  document.getElementById("send");

const chatArea =
  document.getElementById("chat");

const mobileMenu =
  document.getElementById("mobileMenu");

const sidebar =
  document.getElementById("sidebar");

const sidebarOverlay =
  document.getElementById("sidebarOverlay");

const voiceCall =
  document.getElementById("voiceCall");

const voiceStatus =
  document.getElementById("voiceStatus");


/* =========================================================
   MOBILE SIDEBAR
   ========================================================= */

function openMobileSidebar() {

  sidebar.classList.add(
    "mobile-open"
  );

  sidebarOverlay.classList.add(
    "visible"
  );

}


function closeMobileSidebar() {

  sidebar.classList.remove(
    "mobile-open"
  );

  sidebarOverlay.classList.remove(
    "visible"
  );

}


mobileMenu.addEventListener(

/* =========================================================
   CHAT CREATION
   ========================================================= */

function createChat() {

  const chat = {

    id:
      Date.now().toString() +
      Math.random().toString(36).slice(2),

    title:
      "New chat",

    messages:
      []

  };

  chats.unshift(chat);

  currentChat =
    chat.id;

  conversation = [];

  saveChats();

  renderSidebar();

  renderMessages();

  closeMobileSidebar();

}


function newChat() {

  createChat();

}


function getCurrentChat() {

  return chats.find(
    chat =>
      chat.id === currentChat
  );

}


/* =========================================================
   OPEN OLD CHAT
   ========================================================= */

function openChat(id) {

  const chat =
    chats.find(
      chat =>
        chat.id === id
    );

  if (!chat) return;

  currentChat =
    id;

  conversation =
    chat.messages.map(
      message => ({

        role:
          message.role,

        content:
          message.content

      })
    );

  renderMessages();

  renderSidebar();

  closeMobileSidebar();

}


/* =========================================================
   DELETE CHAT
   ========================================================= */

function deleteChat(id) {

  chats =
    chats.filter(
      chat =>
        chat.id !== id
    );

  if (currentChat === id) {

    currentChat = null;
    conversation = [];

  }

  saveChats();

  renderSidebar();

  renderMessages();

}


/* =========================================================
   SIDEBAR
   ========================================================= */

function renderSidebar() {

  savedChats.innerHTML = "";

  if (chats.length === 0) {

    savedChats.innerHTML =
      '<div class="empty-history">No saved chats yet.</div>';

    return;

  }

  chats.forEach(
    chat => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "chat-row" +
        (
          chat.id === currentChat
            ? " active"
            : ""
        );


      const button =
        document.createElement(
          "button"
        );

      button.className =
        "saved-chat";

      button.textContent =
        chat.title ||
        "New chat";

      button.onclick =
        () =>
          openChat(chat.id);


      const options =
        document.createElement(
          "button"
        );

      options.className =
        "chat-options";

      options.type =
        "button";

      options.textContent =
        "⋯";

      options.setAttribute(
        "aria-label",
        "Chat options"
      );


      options.onclick =
        event => {

          event.stopPropagation();

          showChatMenu(
            row,
            chat
          );

        };


      row.appendChild(
        button
      );

      row.appendChild(
        options
      );

      savedChats.appendChild(
        row
      );

    }
  );

}

   CHAT OPTIONS MENU
   ========================================================= */

function showChatMenu(
  row,
  chat
) {

  document
    .querySelectorAll(".chat-menu")
    .forEach(
      menu =>
        menu.remove()
    );


  const menu =
    document.createElement(
      "div"
    );

  menu.className =
    "chat-menu";


  const deleteButton =
    document.createElement(
      "button"
    );

  deleteButton.className =
    "delete-option";

  deleteButton.textContent =
    "🗑 Delete chat";


  deleteButton.onclick =
    event => {

      event.stopPropagation();

      menu.remove();

      const confirmed =
        confirm(
          "Delete this chat permanently?"
        );

      if (confirmed) {

        deleteChat(
          chat.id
        );

      }

    };


  menu.appendChild(
    deleteButton
  );

  row.appendChild(
    menu
  );


  setTimeout(
    () => {

      document.addEventListener(
        "click",
        function closeMenu() {

          menu.remove();

          document.removeEventListener(
            "click",
            closeMenu
          );

        },
        {
          once: true
        }
      );

    },
    0
  );

}


/* =========================================================
   SAFE MARKDOWN FORMATTER
   ========================================================= */

function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function formatMarkdown(text) {

  if (
    text === null ||
    text === undefined
  ) {

    return "";

  }

  let value =
    escapeHTML(text);


  const codeBlocks = [];

  value =
    value.replace(
      /```([\s\S]*?)```/g,
      (match, code) => {

        const index =
          codeBlocks.length;

        codeBlocks.push(
          `<pre><code>${code.trim()}</code></pre>`
        );

        return `@@CODEBLOCK${index}@@`;

      }
    );


  const inlineCode = [];

  value =
    value.replace(
      /`([^`\n]+)`/g,
      (match, code) => {

        const index =
          inlineCode.length;

        inlineCode.push(
          `<code>${code}</code>`
        );

        return `@@INLINECODE${index}@@`;

      }
    );


  value =
    value.replace(
      /\*\*(.+?)\*\*/g,
      "<strong>$1</strong>"
    );


  value =
    value.replace(
      /(^|[^\*])\*([^*\n]+)\*(?!\*)/g,
      "$1<em>$2</em>"
    );


  value =
    value.replace(
      /~~(.+?)~~/g,
      "<del>$1</del>"
    );


  value =
    value.replace(
      /@@INLINECODE(\d+)@@/g,
      (match, index) =>
        inlineCode[Number(index)]
    );


  value =
    value.replace(
      /@@CODEBLOCK(\d+)@@/g,
      (match, index) =>
        codeBlocks[Number(index)]
    );


  value =
    value.replace(
      /(?:^|\n)(?:- |\* )(.+)(?=\n|$)/g,
      (match, item) =>
        `<li>${item}</li>`
    );


  value =
    value.replace(
      /(?:<li>.*?<\/li>\n?)+/g,
      list => {

        return `<ul>${list}</ul>`;

      }
    );


  value =
    value.replace(
      /(?:^|\n)\d+\.\s+(.+)(?=\n|$)/g,
      (match, item) =>
        `<li>${item}</li>`
    );


  value =
    value.replace(
      /\n/g,
      "<br>"
    );


  return value;

}

/* =========================================================
   SPEECH SYNTHESIS
   ========================================================= */

let speechUnlocked = false;

let speechQueue = [];

let speechPlaying = false;

let speechGeneration = 0;


/*
  IMPORTANT:
  This function starts the microphone only when
  Luna has completely stopped speaking.
*/

function startListeningAfterSpeech() {

  if (
    !voiceMode ||
    !recognition ||
    recognitionActive ||
    speechPlaying
  ) {

    return;

  }


  voiceStatus.textContent =
    "🎙 Listening...";


  setTimeout(
    () => {

      if (
        !voiceMode ||
        !recognition ||
        recognitionActive ||
        speechPlaying
      ) {

        return;

      }


      try {

        recognition.start();

      } catch (error) {

        /*
          Chrome sometimes throws "already started"
          even though our state says otherwise.
        */

        console.warn(
          "Microphone restart:",
          error
        );

      }

    },
    150
  );

}


function speechSupported() {

  return (
    "speechSynthesis" in window &&
    "SpeechSynthesisUtterance" in window
  );

}


function getLunaVoice() {

  if (!speechSupported()) {

    return null;

  }

  const voices =
    window.speechSynthesis.getVoices();

  if (
    !voices ||
    !voices.length
  ) {

    return null;

  }


  const preferredNames = [

    "Samantha",
    "Microsoft Zira",
    "Google US English Female",
    "Karen",
    "Victoria",
    "Moira",
    "Ava",
    "Jenny",
    "Aria",
    "Google US English"

  ];


  for (
    const name of preferredNames
  ) {

    const voice =
      voices.find(
        voice =>
          voice.name
            .toLowerCase()
            .includes(
              name.toLowerCase()
            )
      );

    if (voice) {

      return voice;

    }

  }


  return (
    voices.find(
      voice =>
        voice.lang &&
        voice.lang
          .toLowerCase()
          .startsWith("en-us")
    ) ||

    voices.find(
      voice =>
        voice.lang &&
        voice.lang
          .toLowerCase()
          .startsWith("en")
    ) ||

    voices[0]
  );

}


function unlockSpeech() {

  if (!speechSupported()) {

    return false;

  }


  try {

    const synth =
      window.speechSynthesis;

    synth.cancel();


    const unlock =
      new SpeechSynthesisUtterance(
        " "
      );

    unlock.volume =
      0.01;

    unlock.rate =
      10;

    unlock.pitch =
      1;

    unlock.lang =
      "en-US";


    const voice =
      getLunaVoice();

    if (voice) {

      unlock.voice =
        voice;

    }


    synth.speak(
      unlock
    );


    speechUnlocked =
      true;


    return true;

  } catch (error) {

    console.error(
      "Speech unlock failed:",
      error
    );

    return false;

  }

}


function splitSpeechText(text) {

  if (!text) return [];

  const clean =
    String(text)
      .replace(/\s+/g, " ")
      .trim();

  if (!clean) return [];


  const sentences =
    clean.match(
      /[^.!?]+[.!?]+|[^.!?]+$/g
    ) || [clean];


  const chunks = [];

  let current = "";


  for (
    const sentence of sentences
  ) {

    const trimmed =
      sentence.trim();

    if (!trimmed) continue;


    if (
      (current + " " + trimmed)
        .trim()
        .length <= 220
    ) {

      current =
        (
          current
            ? current + " "
            : ""
        ) +
        trimmed;

    } else {

      if (current) {

        chunks.push(
          current
        );

      }


      if (
        trimmed.length > 220
      ) {

        const words =
          trimmed.split(" ");

        let part = "";


        words.forEach(
          word => {

            if (
              (part + " " + word)
                .trim()
                .length <= 220
            ) {

              part =
                (
                  part
                    ? part + " "
                    : ""
                ) +
                word;

            } else {

              if (part) {

                chunks.push(
                  part
                );

              }

              part =
                word;

            }

          }
        );


        if (part) {

          current =
            part;

        } else {

          current =
            "";

        }

      } else {

        current =
          trimmed;

      }

    }

  }


  if (current) {

    chunks.push(
      current
    );

  }


  return chunks;

}


/* =========================================================
   STOP LUNA SPEAKING
   ========================================================= */

function stopLunaSpeaking() {

  speechGeneration++;

  speechQueue = [];

  speechPlaying = false;


  if (speechSupported()) {

    try {

      window.speechSynthesis.cancel();

    } catch (error) {

      console.error(
        "Could not stop speech:",
        error
      );

    }

  }


  /*
    The moment Luna stops, return control
    to the microphone.
  */

  if (voiceMode) {

    voiceStatus.textContent =
      "🎙 Listening...";

    startListeningAfterSpeech();

  }

}


/* =========================================================
   SPEAK NEXT CHUNK
   ========================================================= */

function speakNextChunk(
  generation
) {

  if (
    generation !== speechGeneration
  ) {

    speechPlaying =
      false;

    return;

  }


  if (!speechQueue.length) {

    /*
      Luna has COMPLETELY finished.
      This is the important fix.
    */

    speechPlaying =
      false;


    voiceStatus.textContent =
      "🎙 Listening...";


    startListeningAfterSpeech();

    return;

  }


  const text =
    speechQueue.shift();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  const voice =
    getLunaVoice();


  if (voice) {

    utterance.voice =
      voice;

    utterance.lang =
      voice.lang;

  } else {

    utterance.lang =
      "en-US";

  }


  utterance.rate =
    1.0;

  utterance.pitch =
    1.08;

  utterance.volume =
    1.0;


  utterance.onstart =
    () => {

      if (
        generation !== speechGeneration
      ) {

        return;

      }


      speechPlaying =
        true;


      voiceStatus.textContent =
        "🔊 Luna is speaking...";


      /*
        Make absolutely sure recognition
        is not running while Luna talks.
      */

      if (
        recognition &&
        recognitionActive
      ) {

        try {

          recognition.stop();

        } catch (error) {

          console.warn(
            "Could not stop recognition:",
            error
          );

        }

      }

    };


  utterance.onend =
    () => {

      if (
        generation !== speechGeneration
      ) {

        return;

      }


      /*
        There is another chunk.
      */

      if (speechQueue.length > 0) {

        setTimeout(
          () => {

            speakNextChunk(
              generation
            );

          },
          80
        );

        return;

      }


      /*
        NO MORE CHUNKS.
        Luna is now officially done speaking.
      */

      speechPlaying =
        false;


      voiceStatus.textContent =
        "🎙 Listening...";


      startListeningAfterSpeech();

    };


  utterance.onerror =
    event => {

      console.error(
        "Speech synthesis error:",
        event
      );


      if (
        generation !== speechGeneration
      ) {

        return;

      }


      speechPlaying =
        false;


      speechQueue = [];


      voiceStatus.textContent =
        "🎙 Listening...";


      startListeningAfterSpeech();

    };


  try {

    if (
      window.speechSynthesis.paused
    ) {

      window.speechSynthesis.resume();

    }


    window.speechSynthesis.speak(
      utterance
    );

  } catch (error) {

    console.error(
      "Speech synthesis failed:",
      error
    );


    speechPlaying =
      false;


    startListeningAfterSpeech();

  }

}


/* =========================================================
   SPEAK AS LUNA
   ========================================================= */

function speakAsLuna(text) {

  if (!speechSupported()) {

    console.warn(
      "Speech synthesis is not supported."
    );

    return;

  }


  /*
    Stop microphone before Luna begins speaking.
    This prevents Luna from hearing herself.
  */

  if (
    recognition &&
    recognitionActive
  ) {

    try {

      recognition.stop();

    } catch (error) {

      console.warn(
        "Could not stop microphone:",
        error
      );

    }

  }


  if (!speechUnlocked) {

    unlockSpeech();

  }


  speechGeneration++;

  speechQueue = [];

  speechPlaying = false;


  try {

    window.speechSynthesis.cancel();

  } catch (error) {

    console.error(
      error
    );

  }


  const chunks =
    splitSpeechText(
      text
    );


  if (!chunks.length) {

    speechPlaying =
      false;

    startListeningAfterSpeech();

    return;

  }


  speechQueue =
    chunks;

  speechPlaying =
    true;


  const generation =
    speechGeneration;


  try {

    window.speechSynthesis.resume();

  } catch (error) {

    console.error(
      error
    );

  }


  speakNextChunk(
    generation
  );

}


/* =========================================================
   SPEECH SYNTHESIS EVENTS
   ========================================================= */

if (speechSupported()) {

  window.speechSynthesis.onvoiceschanged =
    () => {

      getLunaVoice();

    };


  setTimeout(
    () => {

      getLunaVoice();

    },
    100
  );

}


/*
  Browser speech synthesis can occasionally pause
  by itself. Resume it while Luna is supposed to
  be speaking.
*/

setInterval(
  () => {

    if (
      speechSupported() &&
      speechPlaying &&
      window.speechSynthesis.speaking &&
      window.speechSynthesis.paused
    ) {

      try {

        window.speechSynthesis.resume();

      } catch (error) {

        console.error(
          "Speech keep-alive error:",
          error
        );

      }

    }

  },
  1000
);


/* =========================================================
   VOICE RECOGNITION
   ========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


let recognition = null;

let voiceMode = false;

let recognitionActive = false;

let processingVoiceResult = false;

let recognitionRestartTimer = null;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();


  /*
    Continuous recognition is deliberately OFF.

    Chrome handles this much more reliably.
    When it ends, we immediately restart it.
  */

  recognition.continuous =
    false;

  recognition.interimResults =
    false;

  recognition.lang =
    "en-US";


  recognition.onstart =
    () => {

      recognitionActive =
        true;

      processingVoiceResult =
        false;


      voiceCall.classList.add(
        "active"
      );

      voiceStatus.classList.add(
        "visible"
      );


      if (!speechPlaying) {

        voiceStatus.textContent =
          "🎙 Listening...";

      }

    };


  recognition.onresult =
    event => {

      /*
        Ignore results if Luna somehow starts
        speaking at the same time.
      */

      if (
        !voiceMode ||
        speechPlaying
      ) {

        return;

      }


      /*
        Prevent duplicate result events.
      */

      if (processingVoiceResult) {

        return;

      }


      processingVoiceResult =
        true;


      let transcript = "";


      try {

        transcript =
          event.results
            .item(0)
            .item(0)
            .transcript
            .trim();

      } catch (error) {

        console.error(
          "Could not read speech result:",
          error
        );

        processingVoiceResult =
          false;

        return;

      }


      /*
        Stop this recognition session immediately.
        This prevents Chrome from continuing to
        capture the assistant's upcoming voice.
      */

      if (
        recognition &&
        recognitionActive
      ) {

        try {

          recognition.stop();

        } catch (error) {

          console.warn(
            "Could not stop recognition after result:",
            error
          );

        }

      }


      if (!transcript) {

        processingVoiceResult =
          false;

        startListeningAfterSpeech();

        return;

      }


      voiceStatus.textContent =
        "Luna is thinking...";


      /*
        Only ONE call to sendMessage.
      */

      sendMessage(
        transcript,
        true
      );

    };


  recognition.onerror =
    event => {

      console.error(
        "Voice recognition error:",
        event.error
      );


      recognitionActive =
        false;


      if (!voiceMode) {

        return;

      }


      /*
        These errors are recoverable.
      */

      const recoverableErrors = [

        "no-speech",
        "audio-capture",
        "network",
        "aborted"

      ];


      if (
        recoverableErrors.includes(
          event.error
        )
      ) {

        if (!speechPlaying) {

          voiceStatus.textContent =
            "🎙 Listening...";

        }


        startListeningAfterSpeech();

        return;

      }


      voiceStatus.textContent =
        "Microphone error.";


      setTimeout(
        () => {

          if (
            voiceMode &&
            !speechPlaying
          ) {

            startListeningAfterSpeech();

          }

        },
        1000
      );

    };


  recognition.onend =
    () => {

      recognitionActive =
        false;


      /*
        Chrome ends non-continuous recognition
        after every phrase.

        If Luna is NOT speaking, immediately
        start another recognition session.
      */

      if (
        voiceMode &&
        !speechPlaying &&
        !processingVoiceResult
      ) {

        startListeningAfterSpeech();

      }

    };

}


/* =========================================================
   START VOICE CALL
   ========================================================= */

function startVoiceCall() {

  if (!recognition) {

    alert(
      "Voice recognition is not supported by this browser. Try Chrome or Edge."
    );

    return;

  }


  unlockSpeech();


  voiceMode =
    true;

  processingVoiceResult =
    false;


  voiceCall.classList.add(
    "active"
  );

  voiceStatus.classList.add(
    "visible"
  );

  voiceStatus.textContent =
    "🎙 Listening...";


  startListeningAfterSpeech();

}


/* =========================================================
   STOP VOICE CALL
   ========================================================= */

function stopVoiceCall() {

  voiceMode =
    false;

  processingVoiceResult =
    false;


  if (recognitionRestartTimer) {

    clearTimeout(
      recognitionRestartTimer
    );

    recognitionRestartTimer =
      null;

  }


  voiceStatus.classList.remove(
    "visible"
  );

  voiceCall.classList.remove(
    "active"
  );


  /*
    Stop Luna immediately.
  */

  speechGeneration++;

  speechQueue = [];

  speechPlaying = false;


  if (speechSupported()) {

    try {

      window.speechSynthesis.cancel();

    } catch (error) {

      console.error(
        error
      );

    }

  }


  /*
    Stop microphone immediately.
  */

  if (
    recognition &&
    recognitionActive
  ) {

    try {

      recognition.stop();

    } catch (error) {

      console.error(
        error
      );

    }

  }

}


/* =========================================================
   VOICE CALL BUTTON
   ========================================================= */

voiceCall.addEventListener(
  "click",
  () => {

    if (voiceMode) {

      stopVoiceCall();

    } else {

      startVoiceCall();

    }

  }
);


/* =========================================================
   SEND MESSAGE
   ========================================================= */

async function sendMessage(
  text,
  fromVoice = false
) {

  text =
    text.trim();

  if (!text) {

    if (fromVoice) {

      processingVoiceResult =
        false;

      startListeningAfterSpeech();

    }

    return;

  }


  if (!currentChat) {

    createChat();

  }


  const chat =
    getCurrentChat();


  addMessage(
    "user",
    text
  );

  saveMessage(
    "user",
    text
  );


  conversation.push({

    role:
      "user",

    content:
      text

  });


  input.value =
    "";

  input.style.height =
    "auto";

  sendButton.disabled =
    true;


  const thinking =
    addMessageElement(
      "assistant",
      "Thinking...",
      "thinking"
    );


  thinking
    .querySelector(
      ".message-content"
    )
    .classList.add(
      "thinking"
    );


  scrollToBottom();


  try {

    const response =
      await fetch(
        "/api/chat",
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              messages:
                conversation,

              memory:
                buildMemoryForLuna()

            })

        }
      );


    const data =
      await response.json();


    thinking.remove();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Luna could not respond."
      );

    }


    const answer =
      data.message?.content ||
      data.response ||
      "Luna didn't return a response.";


    addMessage(
      "assistant",
      answer
    );


    saveMessage(
      "assistant",
      answer
    );


    conversation.push({

      role:
        "assistant",

      content:
        answer

    });


    if (fromVoice) {

      /*
        processingVoiceResult is reset here,
        but recognition does NOT start yet.

        speakAsLuna controls when the microphone
        comes back.
      */

      processingVoiceResult =
        false;

      speakAsLuna(
        answer
      );

    }

  } catch (error) {

    console.error(
      "Luna error:",
      error
    );


    thinking
      .querySelector(
        ".message-content"
      )
      .textContent =
        "Luna couldn't respond right now.";


    if (fromVoice) {

      processingVoiceResult =
        false;

      speechPlaying =
        false;

      stopLunaSpeaking();


      if (voiceMode) {

        voiceStatus.textContent =
          "🎙 Listening...";

        startListeningAfterSpeech();

      }

    }

  } finally {

    sendButton.disabled =
      false;


    if (!fromVoice) {

      input.focus();

    }

  }

}


/* =========================================================
   QUICK MESSAGE
   ========================================================= */

function quickMessage(text) {

  sendMessage(
    text
  );

}


/* =========================================================
   FORM
   ========================================================= */

form.addEventListener(
  "submit",
  event => {

    event.preventDefault();

    sendMessage(
      input.value
    );

  }
);


/* =========================================================
   ENTER TO SEND
   ========================================================= */

input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      form.requestSubmit();

    }

  }
);


/* =========================================================
   AUTO RESIZE
   ========================================================= */

input.addEventListener(
  "input",
  () => {

    input.style.height =
      "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        120
      ) + "px";

  }
);


/* =========================================================
   STARTUP
   ========================================================= */

function loadInitialState() {

  currentChat =
    null;

  conversation =
    [];


  renderSidebar();

  renderMessages();

}


loadInitialState();

</script>
