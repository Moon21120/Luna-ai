<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Luna AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #0b111a;
      color: #f4f7fb;
    }

    body {
      overflow: hidden;
    }

    button,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100dvh;
      min-height: 100dvh;
    }

    /* SIDEBAR */

    .sidebar {
      width: 270px;
      flex-shrink: 0;
      background: #101925;
      border-right: 1px solid #243142;
      padding: 18px;
      display: flex;
      flex-direction: column;
      z-index: 1001;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: #182538;
      border: 1px solid #304158;
      font-size: 24px;
    }

    .brand-name {
      font-size: 19px;
      font-weight: 700;
    }

    .brand-subtitle {
      color: #8997aa;
      font-size: 12px;
      margin-top: 3px;
    }

    .new-chat {
      width: 100%;
      border: 1px solid #304158;
      background: #172335;
      color: white;
      border-radius: 11px;
      padding: 12px;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .new-chat:hover {
      background: #1d2c42;
    }

    .section-title {
      color: #77869a;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 9px;
    }

    .quick-button {
      width: 100%;
      border: 0;
      background: transparent;
      color: #dce4ef;
      text-align: left;
      padding: 10px;
      border-radius: 9px;
      margin-bottom: 3px;
    }

    .quick-button:hover {
      background: #172335;
    }

    .saved-title {
      margin-top: 22px;
    }

    .saved-chats {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    /* CHAT ROW */

    .chat-row {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      margin-bottom: 2px;
      border-radius: 8px;
    }

    .chat-row:hover,
    .chat-row.active {
      background: #182538;
    }

    .saved-chat {
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      color: #cbd5e1;
      text-align: left;
      padding: 10px;
      padding-right: 40px;
      border-radius: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-row:hover .saved-chat,
    .chat-row.active .saved-chat {
      color: white;
    }

    .chat-options {
      position: absolute;
      right: 5px;
      top: 5px;
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #9aa8ba;
      font-size: 18px;
      line-height: 1;
    }

    .chat-options:hover {
      background: #26364b;
      color: white;
    }

    /* CHAT MENU */

    .chat-menu {
      position: absolute;
      z-index: 2000;
      right: 8px;
      top: 38px;
      width: 150px;
      background: #172335;
      border: 1px solid #304158;
      border-radius: 10px;
      padding: 5px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .45);
    }

    .chat-menu button {
      width: 100%;
      border: 0;
      background: transparent;
      color: #e1e7ef;
      text-align: left;
      padding: 10px;
      border-radius: 7px;
      font-size: 13px;
    }

    .chat-menu button:hover {
      background: #26364b;
    }

    .chat-menu .delete-option {
      color: #ff8585;
    }

    .empty-history {
      color: #66758a;
      font-size: 12px;
      padding: 8px;
    }

    .sidebar-bottom {
      padding-top: 15px;
      color: #8290a3;
      font-size: 12px;
      border-top: 1px solid #202d3d;
    }

    .online {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #65d391;
    }

    /* MOBILE MENU */

    .mobile-menu {
      display: none;
      border: 0;
      background: transparent;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      font-size: 23px;
      place-items: center;
      flex-shrink: 0;
    }

    .mobile-menu:hover {
      background: #182538;
    }

    .sidebar-overlay {
      display: none;
    }

    /* MAIN */

    .main {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #0b111a;
    }

    /* TOP BAR */

    .topbar {
      height: 64px;
      min-height: 64px;
      flex-shrink: 0;
      border-bottom: 1px solid #202d3d;
      display: flex;
      align-items: center;
      padding: 0 25px;
      gap: 10px;
    }

    .model {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 600;
    }

    .moon {
      font-size: 22px;
    }

    /* VOICE CALL BUTTON */

    .voice-call {
      margin-left: auto;
      border: 1px solid #304158;
      background: #172335;
      color: white;
      border-radius: 10px;
      padding: 9px 13px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .voice-call:hover {
      background: #24364d;
    }

    .voice-call.active {
      background: #26364b;
      border-color: #526987;
    }

    /* CHAT */

    .chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 35px 25px 170px;
      -webkit-overflow-scrolling: touch;
    }

    .chat-inner {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    /* WELCOME */

    .welcome {
      text-align: center;
      margin: 70px auto 35px;
    }

    .welcome-logo {
      font-size: 52px;
      margin-bottom: 10px;
    }

    .welcome h1 {
      margin: 0;
      font-size: 36px;
    }

    .welcome p {
      color: #8d9bad;
      max-width: 600px;
      margin: 12px auto 30px;
      line-height: 1.6;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .card {
      background: #111d2b;
      border: 1px solid #27364a;
      color: white;
      border-radius: 13px;
      padding: 18px;
      text-align: left;
    }

    .card:hover {
      background: #172538;
    }

    .card strong {
      display: block;
      margin-bottom: 6px;
    }

    .card small {
      color: #8290a3;
    }

    /* MESSAGES */

    .messages {
      display: flex;
      flex-direction: column;
      gap: 28px;
      width: 100%;
    }

    .message {
      display: flex;
      width: 100%;
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.assistant {
      justify-content: flex-end;
    }

    .message-box {
      max-width: 75%;
      display: flex;
      gap: 11px;
      align-items: flex-start;
    }

    .assistant .message-box {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 34px;
      min-width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: #182538;
      color: white;
    }

    .user .avatar {
      background: #26364b;
    }

    .message-content {
      padding: 9px 13px;
      border-radius: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .user .message-content {
      background: #1b2a3d;
      border-top-left-radius: 4px;
    }

    .assistant .message-content {
      background: #111a27;
      border: 1px solid #263547;
      border-top-right-radius: 4px;
    }

    .thinking {
      color: #7f8da0;
      font-style: italic;
    }

    /* COMPOSER */

    .composer-area {
      position: fixed;
      z-index: 10;
      bottom: 0;
      left: 270px;
      right: 0;
      padding: 18px 25px 20px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      background: linear-gradient(
        transparent,
        #0b111a 25%
      );
    }

    .composer {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: #111c29;
      border: 1px solid #2b3a4d;
      border-radius: 16px;
      padding: 9px;
    }

    textarea {
      flex: 1;
      width: 100%;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 15px;
      line-height: 1.5;
      min-height: 42px;
      max-height: 160px;
      padding: 11px 7px;
    }

    textarea::placeholder {
      color: #718096;
    }

    .send {
      border: 0;
      cursor: pointer;
      flex-shrink: 0;
      border-radius: 11px;
      width: 42px;
      height: 42px;
      color: white;
      background: #24364d;
      font-size: 20px;
    }

    .send:hover {
      background: #304762;
    }

    .send:disabled {
      opacity: .5;
      cursor: default;
    }

    .note {
      text-align: center;
      color: #66758a;
      font-size: 11px;
      margin-top: 8px;
    }

    /* VOICE STATUS */

    .voice-status {
      display: none;
      text-align: center;
      color: #9aa8ba;
      font-size: 12px;
      margin-top: 7px;
    }

    .voice-status.visible {
      display: block;
    }

    /* TABLET */

    @media (max-width: 900px) {

      .sidebar {
        width: 230px;
        padding: 14px;
      }

      .composer-area {
        left: 230px;
      }

      .chat {
        padding-left: 18px;
        padding-right: 18px;
      }

      .topbar {
        padding-left: 18px;
        padding-right: 18px;
      }

      .message-box {
        max-width: 82%;
      }
    }

    /* MOBILE */

    @media (max-width: 700px) {

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .app {
        width: 100%;
        height: 100dvh;
        min-height: 100dvh;
      }

      .sidebar {
        position: fixed;
        z-index: 1001;
        left: 0;
        top: 0;
        bottom: 0;
        width: min(300px, 85vw);
        display: flex;
        transform: translateX(-105%);
        transition: transform 0.25s ease;
        box-shadow: 12px 0 35px rgba(0, 0, 0, .45);
        overflow-y: auto;
      }

      .sidebar.mobile-open {
        transform: translateX(0);
      }

      .sidebar-overlay {
        position: fixed;
        z-index: 1000;
        inset: 0;
        display: block;
        background: rgba(0, 0, 0, .55);
        opacity: 0;
        pointer-events: none;
        transition: opacity .25s ease;
      }

      .sidebar-overlay.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .main {
        width: 100%;
        height: 100%;
        min-width: 0;
      }

      .topbar {
        height: 56px;
        min-height: 56px;
        padding: 0 12px;
      }

      .mobile-menu {
        display: grid;
      }

      .model {
        font-size: 16px;
      }

      .moon {
        font-size: 21px;
      }

      .voice-call {
        padding: 8px 10px;
        font-size: 12px;
      }

      .chat {
        width: 100%;
        padding: 22px 12px 155px;
      }

      .chat-inner {
        width: 100%;
        max-width: none;
      }

      .welcome {
        margin: 30px auto 25px;
        padding: 0 5px;
      }

      .welcome-logo {
        font-size: 44px;
      }

      .welcome h1 {
        font-size: 28px;
      }

      .welcome p {
        font-size: 14px;
        line-height: 1.5;
        margin: 10px auto 22px;
      }

      .cards {
        grid-template-columns: 1fr;
        gap: 9px;
      }

      .card {
        width: 100%;
        padding: 15px;
        min-height: 70px;
      }

      .messages {
        gap: 20px;
      }

      .message-box {
        max-width: 88%;
        gap: 7px;
      }

      .avatar {
        width: 30px;
        min-width: 30px;
        height: 30px;
        border-radius: 9px;
        font-size: 13px;
      }

      .message-content {
        padding: 9px 11px;
        font-size: 14px;
        line-height: 1.55;
      }

      .composer-area {
        left: 0;
        right: 0;
        width: 100%;
        padding: 10px 10px 10px;
        padding-bottom: calc(
          10px + env(safe-area-inset-bottom)
        );
        background: linear-gradient(
          transparent,
          #0b111a 18%
        );
      }

      .composer {
        width: 100%;
        max-width: none;
        border-radius: 15px;
        padding: 7px;
        gap: 5px;
      }

      textarea {
        font-size: 16px;
        min-height: 42px;
        max-height: 120px;
        padding: 10px 6px;
      }

      .send {
        width: 40px;
        height: 40px;
        min-width: 40px;
      }

      .note {
        font-size: 9px;
        margin-top: 5px;
      }
    }

    @media (max-width: 380px) {

      .sidebar {
        width: 86vw;
      }

      .topbar {
        padding-left: 8px;
        padding-right: 8px;
      }

      .chat {
        padding-left: 9px;
        padding-right: 9px;
      }

      .message-box {
        max-width: 92%;
      }

      .message-content {
        font-size: 13.5px;
      }

      .welcome h1 {
        font-size: 26px;
      }

      .welcome p {
        font-size: 13px;
      }

      .composer-area {
        padding-left: 7px;
        padding-right: 7px;
      }

      .voice-call {
        padding: 7px 8px;
      }

      .voice-call span:last-child {
        display: none;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- MOBILE SIDEBAR BACKDROP -->

  <div
    class="sidebar-overlay"
    id="sidebarOverlay"
  ></div>

  <!-- SIDEBAR -->

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="brand">

      <div class="logo">☾</div>

      <div>
        <div class="brand-name">
          Luna AI
        </div>

        <div class="brand-subtitle">
          Your AI assistant
        </div>
      </div>

    </div>

    <button
      class="new-chat"
      onclick="newChat()"
    >
      ＋ New chat
    </button>

    <div class="section-title">
      QUICK START
    </div>

    <button
      class="quick-button"
      onclick="quickMessage('Explain something complicated in a simple way.')"
    >
      ✦ Explain something
    </button>

    <button
      class="quick-button"
      onclick="quickMessage('Help me brainstorm an idea.')"
    >
      ✧ Brainstorm an idea
    </button>

    <button
      class="quick-button"
      onclick="quickMessage('Help me write something.')"
    >
      ✎ Help me write
    </button>

    <div class="section-title saved-title">
      CHATS
    </div>

    <div
      class="saved-chats"
      id="savedChats"
    ></div>

    <div class="sidebar-bottom">

      <div class="online">
        <span class="dot"></span>
        Luna is online
      </div>

      <div>
        Powered by Ollama Cloud
      </div>

    </div>

  </aside>

  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <button
        class="mobile-menu"
        id="mobileMenu"
        aria-label="Open menu"
        type="button"
      >
        ☰
      </button>

      <div class="model">

        <span class="moon">
          ☾
        </span>

        <span>
          Luna AI
        </span>

      </div>

      <!-- VOICE CALL -->

      <button
        class="voice-call"
        id="voiceCall"
        type="button"
        aria-label="Start voice call"
      >
        <span>🎙</span>
        <span>Voice Call</span>
      </button>

    </header>

    <!-- CHAT -->

    <section
      class="chat"
      id="chat"
    >

      <div class="chat-inner">

        <div
          class="welcome"
          id="welcome"
        >

          <div class="welcome-logo">
            ☾
          </div>

          <h1>
            How can I help?
          </h1>

          <p>
            Talk with Luna, ask questions,
            brainstorm ideas, or just have a
            conversation.
          </p>

          <div class="cards">

            <button
              class="card"
              onclick="quickMessage('What are some interesting things I could learn today?')"
            >
              <strong>
                ✦ Learn something
              </strong>

              <small>
                Explore a new topic
              </small>
            </button>

            <button
              class="card"
              onclick="quickMessage('Help me come up with a creative idea.')"
            >
              <strong>
                ✧ Get creative
              </strong>

              <small>
                Brainstorm with Luna
              </small>
            </button>

            <button
              class="card"
              onclick="quickMessage('Give me a useful tip I can use today.')"
            >
              <strong>
                ⌁ Get a tip
              </strong>

              <small>
                Something practical
              </small>
            </button>

          </div>

        </div>

        <div
          class="messages"
          id="messages"
        ></div>

      </div>

    </section>

    <!-- COMPOSER -->

    <div class="composer-area">

      <form
        class="composer"
        id="form"
      >

        <textarea
          id="input"
          rows="1"
          maxlength="20000"
          placeholder="Message Luna..."
          autocomplete="off"
        ></textarea>

        <button
          class="send"
          id="send"
          type="submit"
          aria-label="Send message"
        >
          ↑
        </button>

      </form>

      <div
        class="voice-status"
        id="voiceStatus"
      >
        🎙 Listening...
      </div>

      <div class="note">
        Luna can make mistakes. Check important information.
      </div>

    </div>

  </main>

</div>

<script>

/* STORAGE */

const STORAGE_KEY = "luna_chats";
const MEMORY_KEY = "luna_memory";

let chats =
  JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
  );

let memory =
  JSON.parse(
    localStorage.getItem(MEMORY_KEY) || "[]"
  );

let currentChat = null;
let conversation = [];


/* ELEMENTS */

const form =
  document.getElementById("form");

const input =
  document.getElementById("input");

const messages =
  document.getElementById("messages");

const welcome =
  document.getElementById("welcome");

const savedChats =
  document.getElementById("savedChats");

const sendButton =
  document.getElementById("send");

const chatArea =
  document.getElementById("chat");

const mobileMenu =
  document.getElementById("mobileMenu");

const sidebar =
  document.getElementById("sidebar");

const sidebarOverlay =
  document.getElementById("sidebarOverlay");

const voiceCall =
  document.getElementById("voiceCall");

const voiceStatus =
  document.getElementById("voiceStatus");


/* MOBILE SIDEBAR */

function openMobileSidebar() {

  sidebar.classList.add(
    "mobile-open"
  );

  sidebarOverlay.classList.add(
    "visible"
  );

}


function closeMobileSidebar() {

  sidebar.classList.remove(
    "mobile-open"
  );

  sidebarOverlay.classList.remove(
    "visible"
  );

}


mobileMenu.addEventListener(
  "click",
  () => {

    if (
      sidebar.classList.contains(
        "mobile-open"
      )
    ) {

      closeMobileSidebar();

    } else {

      openMobileSidebar();

    }

  }
);


sidebarOverlay.addEventListener(
  "click",
  closeMobileSidebar
);


/* STORAGE */

function saveChats() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(chats)
  );

}


function saveMemory() {

  localStorage.setItem(
    MEMORY_KEY,
    JSON.stringify(memory)
  );

}


/* CHAT CREATION */

function createChat() {

  const chat = {

    id:
      Date.now().toString() +
      Math.random().toString(36).slice(2),

    title:
      "New chat",

    messages:
      []

  };

  chats.unshift(chat);

  currentChat =
    chat.id;

  conversation = [];

  saveChats();

  renderSidebar();

  renderMessages();

  closeMobileSidebar();

}


function newChat() {

  createChat();

}


function getCurrentChat() {

  return chats.find(
    chat =>
      chat.id === currentChat
  );

}


/* OPEN OLD CHAT */

function openChat(id) {

  const chat =
    chats.find(
      chat =>
        chat.id === id
    );

  if (!chat) return;

  currentChat =
    id;

  conversation =
    chat.messages.map(
      message => ({

        role:
          message.role,

        content:
          message.content

      })
    );

  renderMessages();

  renderSidebar();

  closeMobileSidebar();

}


/* DELETE CHAT */

function deleteChat(id) {

  chats =
    chats.filter(
      chat =>
        chat.id !== id
    );

  if (currentChat === id) {

    currentChat = null;
    conversation = [];

  }

  saveChats();

  renderSidebar();

  renderMessages();

}


/* SIDEBAR */

function renderSidebar() {

  savedChats.innerHTML = "";

  if (chats.length === 0) {

    savedChats.innerHTML =
      '<div class="empty-history">No saved chats yet.</div>';

    return;

  }

  chats.forEach(
    chat => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "chat-row" +
        (
          chat.id === currentChat
            ? " active"
            : ""
        );


      /* CHAT BUTTON */

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "saved-chat";

      button.textContent =
        chat.title ||
        "New chat";

      button.onclick =
        () =>
          openChat(chat.id);


      /* THREE DOT BUTTON */

      const options =
        document.createElement(
          "button"
        );

      options.className =
        "chat-options";

      options.type =
        "button";

      options.textContent =
        "⋯";

      options.setAttribute(
        "aria-label",
        "Chat options"
      );


      options.onclick =
        event => {

          event.stopPropagation();

          showChatMenu(
            row,
            chat
          );

        };


      row.appendChild(
        button
      );

      row.appendChild(
        options
      );

      savedChats.appendChild(
        row
      );

    }
  );

}


/* CHAT OPTIONS MENU */

function showChatMenu(
  row,
  chat
) {

  document
    .querySelectorAll(".chat-menu")
    .forEach(
      menu =>
        menu.remove()
    );


  const menu =
    document.createElement(
      "div"
    );

  menu.className =
    "chat-menu";


  /* DELETE ONLY */

  const deleteButton =
    document.createElement(
      "button"
    );

  deleteButton.className =
    "delete-option";

  deleteButton.textContent =
    "🗑 Delete chat";


  deleteButton.onclick =
    event => {

      event.stopPropagation();

      menu.remove();

      const confirmed =
        confirm(
          "Delete this chat permanently?"
        );

      if (confirmed) {

        deleteChat(
          chat.id
        );

      }

    };


  menu.appendChild(
    deleteButton
  );

  row.appendChild(
    menu
  );


  /* CLOSE WHEN CLICKING ELSEWHERE */

  setTimeout(
    () => {

      document.addEventListener(
        "click",
        function closeMenu() {

          menu.remove();

          document.removeEventListener(
            "click",
            closeMenu
          );

        },
        {
          once: true
        }
      );

    },
    0
  );

}


/* MESSAGES */

function renderMessages() {

  messages.innerHTML = "";

  const chat =
    getCurrentChat();

  if (
    !chat ||
    chat.messages.length === 0
  ) {

    welcome.style.display =
      "block";

    return;

  }

  welcome.style.display =
    "none";

  chat.messages.forEach(
    message => {

      addMessageElement(
        message.role,
        message.content
      );

    }
  );

  scrollToBottom();

}


function addMessageElement(
  role,
  text,
  extraClass = ""
) {

  const message =
    document.createElement(
      "div"
    );

  message.className =
    `message ${role} ${extraClass}`;


  const box =
    document.createElement(
      "div"
    );

  box.className =
    "message-box";


  const avatar =
    document.createElement(
      "div"
    );

  avatar.className =
    "avatar";

  avatar.textContent =
    role === "user"
      ? "●"
      : "☾";


  const content =
    document.createElement(
      "div"
    );

  content.className =
    "message-content";

  content.textContent =
    text;


  box.appendChild(
    avatar
  );

  box.appendChild(
    content
  );

  message.appendChild(
    box
  );

  messages.appendChild(
    message
  );

  return message;

}


function addMessage(
  role,
  text
) {

  welcome.style.display =
    "none";

  addMessageElement(
    role,
    text
  );

  scrollToBottom();

}


function scrollToBottom() {

  setTimeout(
    () => {

      chatArea.scrollTop =
        chatArea.scrollHeight;

    },
    30
  );

}


/* SAVE MESSAGE */

function saveMessage(
  role,
  content
) {

  const chat =
    getCurrentChat();

  if (!chat) return;

  chat.messages.push({

    role:
      role,

    content:
      content

  });


  if (
    role === "user" &&
    chat.title === "New chat"
  ) {

    chat.title =
      content.length > 32
        ? content.substring(
            0,
            32
          ) + "..."
        : content;

  }

  saveChats();

  renderSidebar();

}


/* MEMORY */

function buildMemoryForLuna() {

  return memory.map(
    item => ({

      title:
        item.title,

      messages:
        item.messages

    })
  );

}


/* SPEECH SYNTHESIS */

/*
  Uses the browser's built-in voices.
  No API key or separate voice service
  is required.
*/

function getLunaVoice() {

  if (
    !("speechSynthesis" in window)
  ) {

    return null;

  }

  const voices =
    speechSynthesis.getVoices();

  if (!voices.length) {

    return null;

  }


  /*
    Prefer an English female-sounding
    browser voice when available.
  */

  const preferredNames = [

    "Samantha",
    "Microsoft Zira",
    "Google US English Female",
    "Karen",
    "Victoria",
    "Moira",
    "Ava",
    "Jenny",
    "Aria"

  ];


  for (
    const name of preferredNames
  ) {

    const voice =
      voices.find(
        voice =>
          voice.name
            .toLowerCase()
            .includes(
              name.toLowerCase()
            )
      );

    if (voice) {

      return voice;

    }

  }


  /*
    Otherwise choose an English voice.
  */

  return (
    voices.find(
      voice =>
        voice.lang &&
        voice.lang
          .toLowerCase()
          .startsWith("en")
    ) ||
    voices[0]
  );

}


function speakAsLuna(text) {

  if (
    !("speechSynthesis" in window)
  ) {

    return;

  }

  speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );

  const voice =
    getLunaVoice();

  if (voice) {

    utterance.voice =
      voice;

    utterance.lang =
      voice.lang;

  } else {

    utterance.lang =
      "en-US";

  }


  /*
    Slightly feminine/assistant-like
    default tuning.
  */

  utterance.rate =
    1.0;

  utterance.pitch =
    1.08;

  utterance.volume =
    1.0;


  speechSynthesis.speak(
    utterance
  );

}


/*
  Some browsers load their voices
  asynchronously.
*/

if (
  "speechSynthesis" in window
) {

  speechSynthesis.onvoiceschanged =
    () => {

      getLunaVoice();

    };

}


/* VOICE RECOGNITION */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;

let voiceMode = false;

let recognitionActive = false;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();

  recognition.continuous =
    false;

  recognition.interimResults =
    false;

  recognition.lang =
    "en-US";


  recognition.onstart =
    () => {

      recognitionActive =
        true;

      voiceCall.classList.add(
        "active"
      );

      voiceStatus.classList.add(
        "visible"
      );

      voiceStatus.textContent =
        "🎙 Listening...";

    };


  recognition.onresult =
    event => {

      const transcript =
        event
          .results[0][0]
          .transcript
          .trim();


      recognitionActive =
        false;


      voiceStatus.textContent =
        "Luna is thinking...";


      if (transcript) {

        sendMessage(
          transcript,
          true
        );

      }

    };


  recognition.onerror =
    event => {

      console.error(
        "Voice recognition error:",
        event.error
      );

      recognitionActive =
        false;

      voiceStatus.classList.remove(
        "visible"
      );

      voiceCall.classList.remove(
        "active"
      );

      voiceMode =
        false;

    };


  recognition.onend =
    () => {

      recognitionActive =
        false;

      if (!voiceMode) {

        voiceStatus.classList.remove(
          "visible"
        );

        voiceCall.classList.remove(
          "active"
        );

      }

    };

}


/* START / STOP VOICE CALL */

function startVoiceCall() {

  if (!recognition) {

    alert(
      "Voice recognition is not supported by this browser. Try Chrome or Edge."
    );

    return;

  }


  voiceMode =
    true;


  try {

    recognition.start();

  } catch (error) {

    console.error(
      "Could not start voice recognition:",
      error
    );

  }

}


function stopVoiceCall() {

  voiceMode =
    false;

  voiceStatus.classList.remove(
    "visible"
  );

  voiceCall.classList.remove(
    "active"
  );


  if (
    recognition &&
    recognitionActive
  ) {

    try {

      recognition.stop();

    } catch (error) {

      console.error(error);

    }

  }

}


voiceCall.addEventListener(
  "click",
  () => {

    if (voiceMode) {

      stopVoiceCall();

    } else {

      startVoiceCall();

    }

  }
);


/* SEND MESSAGE */

async function sendMessage(
  text,
  fromVoice = false
) {

  text =
    text.trim();

  if (!text) return;


  /*
    If there isn't an active chat,
    create a completely fresh one.
  */

  if (!currentChat) {

    createChat();

  }


  const chat =
    getCurrentChat();


  addMessage(
    "user",
    text
  );

  saveMessage(
    "user",
    text
  );


  conversation.push({

    role:
      "user",

    content:
      text

  });


  input.value =
    "";

  input.style.height =
    "auto";

  sendButton.disabled =
    true;


  const thinking =
    addMessageElement(
      "assistant",
      "Thinking...",
      "thinking"
    );


  thinking
    .querySelector(
      ".message-content"
    )
    .classList.add(
      "thinking"
    );


  scrollToBottom();


  try {

    const response =
      await fetch(
        "/api/chat",
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              messages:
                conversation,

              memory:
                buildMemoryForLuna()

            })

        }
      );


    const data =
      await response.json();


    thinking.remove();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Luna could not respond."
      );

    }


    const answer =
      data.message?.content ||
      data.response ||
      "Luna didn't return a response.";


    addMessage(
      "assistant",
      answer
    );


    saveMessage(
      "assistant",
      answer
    );


    conversation.push({

      role:
        "assistant",

      content:
        answer

    });


    /*
      If this message came from
      Voice Call, automatically speak
      Luna's response.
    */

    if (fromVoice) {

      speakAsLuna(
        answer
      );

    }


    /*
      Continue voice mode after Luna
      finishes responding.

      This means you can speak again
      after Luna talks.
    */

    if (fromVoice && voiceMode) {

      setTimeout(
        () => {

          if (
            recognition &&
            voiceMode &&
            !recognitionActive
          ) {

            try {

              recognition.start();

            } catch (error) {

              console.error(
                error
              );

            }

          }

        },
        500
      );

    }

  } catch (error) {

    console.error(
      "Luna error:",
      error
    );


    thinking
      .querySelector(
        ".message-content"
      )
      .textContent =
        "Luna couldn't respond right now.";


    if (fromVoice) {

      voiceStatus.textContent =
        "Voice call stopped.";

      voiceMode =
        false;

      voiceCall.classList.remove(
        "active"
      );

      setTimeout(
        () => {

          voiceStatus.classList.remove(
            "visible"
          );

        },
        1500
      );

    }

  } finally {

    sendButton.disabled =
      false;

    input.focus();

  }

}


/* QUICK MESSAGE */

function quickMessage(text) {

  sendMessage(
    text
  );

}


/* FORM */

form.addEventListener(
  "submit",
  event => {

    event.preventDefault();

    sendMessage(
      input.value
    );

  }
);


/* ENTER TO SEND */

input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      form.requestSubmit();

    }

  }
);


/* AUTO RESIZE */

input.addEventListener(
  "input",
  () => {

    input.style.height =
      "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        120
      ) + "px";

  }
);


/* STARTUP */

/*
  Always start with a completely
  fresh chat when the website opens.

  Previous chats remain in the sidebar
  and can still be opened manually.
*/

function loadInitialState() {

  currentChat =
    null;

  conversation =
    [];

  renderSidebar();

  renderMessages();

}


loadInitialState();

</script>

</body>
</html>
