<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Luna AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #0b111a;
      color: #f4f7fb;
    }

    body {
      overflow: hidden;
    }

    button,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* APP */

    .app {
      display: flex;
      width: 100%;
      height: 100dvh;
      min-height: 100dvh;
    }

    /* SIDEBAR */

    .sidebar {
      width: 270px;
      flex-shrink: 0;
      background: #101925;
      border-right: 1px solid #243142;
      padding: 18px;
      display: flex;
      flex-direction: column;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: #182538;
      border: 1px solid #304158;
      font-size: 24px;
    }

    .brand-name {
      font-size: 19px;
      font-weight: 700;
    }

    .brand-subtitle {
      color: #8997aa;
      font-size: 12px;
      margin-top: 3px;
    }

    .new-chat {
      width: 100%;
      border: 1px solid #304158;
      background: #172335;
      color: white;
      border-radius: 11px;
      padding: 12px;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .new-chat:hover {
      background: #1d2c42;
    }

    .section-title {
      color: #77869a;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 9px;
    }

    .quick-button {
      width: 100%;
      border: 0;
      background: transparent;
      color: #dce4ef;
      text-align: left;
      padding: 10px;
      border-radius: 9px;
      margin-bottom: 3px;
    }

    .quick-button:hover {
      background: #172335;
    }

    .saved-title {
      margin-top: 22px;
    }

    .saved-chats {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .saved-chat {
      width: 100%;
      border: 0;
      background: transparent;
      color: #cbd5e1;
      text-align: left;
      padding: 10px;
      border-radius: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .saved-chat:hover,
    .saved-chat.active {
      background: #182538;
      color: white;
    }

    .empty-history {
      color: #66758a;
      font-size: 12px;
      padding: 8px;
    }

    .sidebar-bottom {
      padding-top: 15px;
      color: #8290a3;
      font-size: 12px;
      border-top: 1px solid #202d3d;
    }

    .online {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #65d391;
    }

    /* MAIN */

    .main {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #0b111a;
    }

    /* TOP BAR */

    .topbar {
      height: 64px;
      min-height: 64px;
      flex-shrink: 0;
      border-bottom: 1px solid #202d3d;
      display: flex;
      align-items: center;
      padding: 0 25px;
    }

    .model {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 600;
    }

    .moon {
      font-size: 22px;
    }

    /* CHAT */

    .chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 35px 25px 170px;
      -webkit-overflow-scrolling: touch;
    }

    .chat-inner {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    /* WELCOME */

    .welcome {
      text-align: center;
      margin: 70px auto 35px;
    }

    .welcome-logo {
      font-size: 52px;
      margin-bottom: 10px;
    }

    .welcome h1 {
      margin: 0;
      font-size: 36px;
    }

    .welcome p {
      color: #8d9bad;
      max-width: 600px;
      margin: 12px auto 30px;
      line-height: 1.6;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .card {
      background: #111d2b;
      border: 1px solid #27364a;
      color: white;
      border-radius: 13px;
      padding: 18px;
      text-align: left;
    }

    .card:hover {
      background: #172538;
    }

    .card strong {
      display: block;
      margin-bottom: 6px;
    }

    .card small {
      color: #8290a3;
    }

    /* MESSAGES */

    .messages {
      display: flex;
      flex-direction: column;
      gap: 28px;
      width: 100%;
    }

    .message {
      display: flex;
      width: 100%;
    }

    /*
      User messages = left
      Luna messages = right
    */

    .message.user {
      justify-content: flex-start;
    }

    .message.assistant {
      justify-content: flex-end;
    }

    .message-box {
      max-width: 75%;
      display: flex;
      gap: 11px;
      align-items: flex-start;
    }

    .assistant .message-box {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 34px;
      min-width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: #182538;
      color: white;
    }

    .user .avatar {
      background: #26364b;
    }

    .message-content {
      padding: 9px 13px;
      border-radius: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .user .message-content {
      background: #1b2a3d;
      border-top-left-radius: 4px;
    }

    .assistant .message-content {
      background: #111a27;
      border: 1px solid #263547;
      border-top-right-radius: 4px;
    }

    .thinking {
      color: #7f8da0;
      font-style: italic;
    }

    /* COMPOSER */

    .composer-area {
      position: fixed;
      z-index: 10;
      bottom: 0;
      left: 270px;
      right: 0;
      padding: 18px 25px 20px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      background: linear-gradient(
        transparent,
        #0b111a 25%
      );
    }

    .composer {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: #111c29;
      border: 1px solid #2b3a4d;
      border-radius: 16px;
      padding: 9px;
    }

    textarea {
      flex: 1;
      width: 100%;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 15px;
      line-height: 1.5;
      min-height: 42px;
      max-height: 160px;
      padding: 11px 7px;
    }

    textarea::placeholder {
      color: #718096;
    }

    .send {
      border: 0;
      cursor: pointer;
      flex-shrink: 0;
      border-radius: 11px;
      width: 42px;
      height: 42px;
      color: white;
      background: #24364d;
      font-size: 20px;
    }

    .send:hover {
      background: #304762;
    }

    .send:disabled {
      opacity: .5;
      cursor: default;
    }

    .note {
      text-align: center;
      color: #66758a;
      font-size: 11px;
      margin-top: 8px;
    }

    /* TABLET */

    @media (max-width: 900px) {

      .sidebar {
        width: 230px;
        padding: 14px;
      }

      .composer-area {
        left: 230px;
      }

      .chat {
        padding-left: 18px;
        padding-right: 18px;
      }

      .topbar {
        padding-left: 18px;
        padding-right: 18px;
      }

      .message-box {
        max-width: 82%;
      }
    }

    /* MOBILE */

    @media (max-width: 700px) {

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .app {
        width: 100%;
        height: 100dvh;
        min-height: 100dvh;
      }

      /* Hide desktop sidebar completely */

      .sidebar {
        display: none;
      }

      /* Main becomes the entire phone */

      .main {
        width: 100%;
        height: 100%;
        min-width: 0;
      }

      /* Mobile top bar */

      .topbar {
        height: 56px;
        min-height: 56px;
        padding: 0 15px;
        background: #0b111a;
      }

      .model {
        font-size: 16px;
      }

      .moon {
        font-size: 21px;
      }

      /* Chat takes entire available width */

      .chat {
        width: 100%;
        padding: 22px 12px 155px;
        overflow-x: hidden;
      }

      .chat-inner {
        width: 100%;
        max-width: none;
      }

      /* Welcome */

      .welcome {
        margin: 30px auto 25px;
        padding: 0 5px;
      }

      .welcome-logo {
        font-size: 44px;
        margin-bottom: 8px;
      }

      .welcome h1 {
        font-size: 28px;
        line-height: 1.2;
      }

      .welcome p {
        font-size: 14px;
        line-height: 1.5;
        margin: 10px auto 22px;
        max-width: 360px;
      }

      /* Cards stack on phones */

      .cards {
        grid-template-columns: 1fr;
        gap: 9px;
      }

      .card {
        width: 100%;
        padding: 15px;
        min-height: 70px;
      }

      /* Messages */

      .messages {
        gap: 20px;
      }

      .message-box {
        max-width: 88%;
        gap: 7px;
      }

      .avatar {
        width: 30px;
        min-width: 30px;
        height: 30px;
        border-radius: 9px;
        font-size: 13px;
      }

      .message-content {
        padding: 9px 11px;
        font-size: 14px;
        line-height: 1.55;
        border-radius: 13px;
      }

      /* Composer becomes full width */

      .composer-area {
        left: 0;
        right: 0;
        width: 100%;
        padding: 10px 10px 10px;
        padding-bottom: calc(
          10px + env(safe-area-inset-bottom)
        );
        background: linear-gradient(
          transparent,
          #0b111a 18%
        );
      }

      .composer {
        width: 100%;
        max-width: none;
        border-radius: 15px;
        padding: 7px;
        gap: 5px;
      }

      textarea {
        font-size: 16px;
        min-height: 42px;
        max-height: 120px;
        padding: 10px 6px;
      }

      .send {
        width: 40px;
        height: 40px;
        min-width: 40px;
      }

      .note {
        font-size: 9px;
        margin-top: 5px;
      }
    }

    /* VERY SMALL PHONES */

    @media (max-width: 380px) {

      .topbar {
        padding-left: 12px;
        padding-right: 12px;
      }

      .chat {
        padding-left: 9px;
        padding-right: 9px;
      }

      .message-box {
        max-width: 92%;
      }

      .message-content {
        font-size: 13.5px;
      }

      .welcome h1 {
        font-size: 26px;
      }

      .welcome p {
        font-size: 13px;
      }

      .composer-area {
        padding-left: 7px;
        padding-right: 7px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="brand">

      <div class="logo">☾</div>

      <div>
        <div class="brand-name">Luna AI</div>
        <div class="brand-subtitle">
          Your AI assistant
        </div>
      </div>

    </div>

    <button
      class="new-chat"
      onclick="newChat()"
    >
      ＋ New chat
    </button>

    <div class="section-title">
      QUICK START
    </div>

    <button
      class="quick-button"
      onclick="quickMessage('Explain something complicated in a simple way.')"
    >
      ✦ Explain something
    </button>

    <button
      class="quick-button"
      onclick="quickMessage('Help me brainstorm an idea.')"
    >
      ✧ Brainstorm an idea
    </button>

    <button
      class="quick-button"
      onclick="quickMessage('Help me write something.')"
    >
      ✎ Help me write
    </button>

    <div class="section-title saved-title">
      CHATS
    </div>

    <div
      class="saved-chats"
      id="savedChats"
    ></div>

    <div class="sidebar-bottom">

      <div class="online">
        <span class="dot"></span>
        Luna is online
      </div>

      <div>
        Powered by Ollama Cloud
      </div>

    </div>

  </aside>

  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <div class="model">

        <span class="moon">☾</span>

        <span>Luna AI</span>

      </div>

    </header>

    <!-- CHAT -->

    <section
      class="chat"
      id="chat"
    >

      <div class="chat-inner">

        <div
          class="welcome"
          id="welcome"
        >

          <div class="welcome-logo">
            ☾
          </div>

          <h1>
            How can I help?
          </h1>

          <p>
            Talk with Luna, ask questions,
            brainstorm ideas, or just have a
            conversation.
          </p>

          <div class="cards">

            <button
              class="card"
              onclick="quickMessage('What are some interesting things I could learn today?')"
            >

              <strong>
                ✦ Learn something
              </strong>

              <small>
                Explore a new topic
              </small>

            </button>

            <button
              class="card"
              onclick="quickMessage('Help me come up with a creative idea.')"
            >

              <strong>
                ✧ Get creative
              </strong>

              <small>
                Brainstorm with Luna
              </small>

            </button>

            <button
              class="card"
              onclick="quickMessage('Give me a useful tip I can use today.')"
            >

              <strong>
                ⌁ Get a tip
              </strong>

              <small>
                Something practical
              </small>

            </button>

          </div>

        </div>

        <div
          class="messages"
          id="messages"
        ></div>

      </div>

    </section>

    <!-- COMPOSER -->

    <div class="composer-area">

      <form
        class="composer"
        id="form"
      >

        <textarea
          id="input"
          rows="1"
          maxlength="20000"
          placeholder="Message Luna..."
          autocomplete="off"
        ></textarea>

        <button
          class="send"
          id="send"
          type="submit"
          aria-label="Send message"
        >
          ↑
        </button>

      </form>

      <div class="note">
        Luna can make mistakes. Check important information.
      </div>

    </div>

  </main>

</div>

<script>

const STORAGE_KEY = "luna_chats";
const MEMORY_KEY = "luna_memory";

let chats =
  JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
  );

let memory =
  JSON.parse(
    localStorage.getItem(MEMORY_KEY) || "[]"
  );

let currentChat = null;
let conversation = [];

const form =
  document.getElementById("form");

const input =
  document.getElementById("input");

const messages =
  document.getElementById("messages");

const welcome =
  document.getElementById("welcome");

const savedChats =
  document.getElementById("savedChats");

const sendButton =
  document.getElementById("send");

const chatArea =
  document.getElementById("chat");


function saveChats() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(chats)
  );

}


function saveMemory() {

  localStorage.setItem(
    MEMORY_KEY,
    JSON.stringify(memory)
  );

}


function createChat() {

  const chat = {

    id: Date.now().toString(),

    title: "New chat",

    messages: []

  };

  chats.unshift(chat);

  currentChat = chat.id;

  conversation = [];

  saveChats();

  renderSidebar();

  renderMessages();

}


function getCurrentChat() {

  return chats.find(
    chat => chat.id === currentChat
  );

}


function newChat() {

  createChat();

}


function openChat(id) {

  const chat =
    chats.find(
      chat => chat.id === id
    );

  if (!chat) return;

  currentChat = id;

  conversation =
    chat.messages.map(message => ({

      role: message.role,

      content: message.content

    }));

  renderMessages();

  renderSidebar();

}


function renderSidebar() {

  savedChats.innerHTML = "";

  if (chats.length === 0) {

    savedChats.innerHTML =
      '<div class="empty-history">No saved chats yet.</div>';

    return;

  }

  chats.forEach(chat => {

    const button =
      document.createElement("button");

    button.className =
      "saved-chat" +
      (
        chat.id === currentChat
          ? " active"
          : ""
      );

    button.textContent =
      chat.title || "New chat";

    button.onclick =
      () => openChat(chat.id);

    savedChats.appendChild(button);

  });

}


function renderMessages() {

  messages.innerHTML = "";

  const chat =
    getCurrentChat();

  if (
    !chat ||
    chat.messages.length === 0
  ) {

    welcome.style.display = "block";

    return;

  }

  welcome.style.display = "none";

  chat.messages.forEach(message => {

    addMessageElement(
      message.role,
      message.content
    );

  });

  scrollToBottom();

}


function addMessageElement(
  role,
  text,
  extraClass = ""
) {

  const message =
    document.createElement("div");

  message.className =
    `message ${role} ${extraClass}`;

  const box =
    document.createElement("div");

  box.className =
    "message-box";

  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar";

  avatar.textContent =
    role === "user"
      ? "●"
      : "☾";

  const content =
    document.createElement("div");

  content.className =
    "message-content";

  content.textContent =
    text;

  box.appendChild(avatar);

  box.appendChild(content);

  message.appendChild(box);

  messages.appendChild(message);

  return message;

}


function addMessage(role, text) {

  welcome.style.display =
    "none";

  addMessageElement(
    role,
    text
  );

  scrollToBottom();

}


function scrollToBottom() {

  setTimeout(() => {

    chatArea.scrollTop =
      chatArea.scrollHeight;

  }, 30);

}


function saveMessage(
  role,
  content
) {

  const chat =
    getCurrentChat();

  if (!chat) return;

  chat.messages.push({

    role,

    content

  });

  if (
    role === "user" &&
    chat.title === "New chat"
  ) {

    chat.title =
      content.length > 32
        ? content.substring(0, 32) + "..."
        : content;

  }

  saveChats();

  renderSidebar();

}


function updateMemory(
  userText,
  assistantText
) {

  memory.push({

    user: userText,

    luna: assistantText,

    time: Date.now()

  });

  if (memory.length > 30) {

    memory =
      memory.slice(-30);

  }

  saveMemory();

}


async function sendMessage(text) {

  text =
    text.trim();

  if (!text) return;

  if (!currentChat) {

    createChat();

  }

  const chat =
    getCurrentChat();

  addMessage(
    "user",
    text
  );

  saveMessage(
    "user",
    text
  );

  conversation.push({

    role: "user",

    content: text

  });

  input.value = "";

  input.style.height =
    "auto";

  sendButton.disabled =
    true;

  const thinking =
    addMessageElement(
      "assistant",
      "Thinking...",
      "thinking"
    );

  thinking
    .querySelector(".message-content")
    .classList.add("thinking");

  scrollToBottom();

  try {

    const response =
      await fetch(
        "/api/chat",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            messages:
              conversation,

            memory:
              memory

          })

        }
      );

    const data =
      await response.json();

    thinking.remove();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Luna could not respond."
      );

    }

    const answer =
      data.message?.content ||
      data.response ||
      "Luna didn't return a response.";

    addMessage(
      "assistant",
      answer
    );

    saveMessage(
      "assistant",
      answer
    );

    conversation.push({

      role: "assistant",

      content: answer

    });

    updateMemory(
      text,
      answer
    );

  } catch (error) {

    thinking
      .querySelector(".message-content")
      .textContent =
        "Luna couldn't respond right now.";

    console.error(error);

  } finally {

    sendButton.disabled =
      false;

    input.focus();

  }

}


function quickMessage(text) {

  sendMessage(text);

}


form.addEventListener(
  "submit",
  event => {

    event.preventDefault();

    sendMessage(
      input.value
    );

  }
);


input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      form.requestSubmit();

    }

  }
);


input.addEventListener(
  "input",
  () => {

    input.style.height =
      "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        120
      ) + "px";

  }
);


function loadInitialState() {

  if (chats.length > 0) {

    currentChat =
      chats[0].id;

    conversation =
      chats[0].messages.map(
        message => ({

          role:
            message.role,

          content:
            message.content

        })
      );

    renderMessages();

  } else {

    renderSidebar();

  }

}


loadInitialState();

</script>

</body>
</html>
